# TieBack Studio cost library — TEMPLATE
#
# Replace the numbers below with your own rates, then load it in the app:
#   Equipment catalog tab → "Load cost library (.yaml)" → "Replace catalog with this library".
# It is also saved inside every project file, so a project carries its rates with it.
#
# What to edit first (biggest effect on total CAPEX):
#   spreads[].day_rate_usd      vessel day rates
#   spreads[].mob_demob_usd     mobilisation per campaign
#   items[].procurement_usd     per unit, per metre, or per inch-metre (see cost_basis)
#   items[].fabrication_usd     yard fabrication/assembly/testing, same basis
#   items[].install_days        per unit, or per km for linear items
#   items[].lead_time_months    award → ready for load-out (drives the schedule)
#   items[].uncertainty         [low, most likely, high] multipliers for the Monte Carlo
#
# Keep item_id values unchanged if you want existing projects to keep loading.
